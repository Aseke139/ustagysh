plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.askhat.ustagysh'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.askhat.ustagysh'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
