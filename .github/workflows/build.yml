name: APK жинау

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Папкаларды реттеу
        run: |
          set -e
          J=app/src/main/java/kz/askhat/ustagysh
          R=app/src/main/res
          mkdir -p $J $R/values $R/xml $R/drawable $R/mipmap-anydpi-v26
          mv *.java $J/
          mv AndroidManifest.xml app/src/main/
          mv catcher_config.xml $R/xml/
          mv batyr_banner.xml batyr_icon.xml ic_launcher_bg.xml car_icon.xml $R/drawable/
          mv ic_launcher.xml $R/mipmap-anydpi-v26/
          rm -f build.gradle settings.gradle gradle.properties
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Тапсырыс ұстағыш</string>
              <string name="service_desc">inDrive-та шыққан тапсырысты сүзгі бойынша тексеріп, «Принять» батырмасын басады. Басқа ештеңе баспайды.</string>
          </resources>
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TapsyrysUstagysh"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'kz.askhat.ustagysh'
              compileSdk 34
              defaultConfig {
                  applicationId 'kz.askhat.ustagysh'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '1.3'
              }
              signingConfigs {
                  fixed {
                      storeFile rootProject.file('ustagysh.jks')
                      storePassword 'ustagysh123'
                      keyAlias 'ustagysh'
                      keyPassword 'ustagysh123'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  encoding 'UTF-8'
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          EOF
          find app -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tapsyrys-ustagysh-apk
          path: app/build/outputs/apk/debug/app-debug.apk
